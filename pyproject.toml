[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ducksdrive"
version = "1.1.0"
description = "Cliente de Nuvem e Interface Gráfica Rclone para Linux (PySide6 / Qt6)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Patopatetico2-lab", email = "dev@rclone-drive-gui.local" }
]
keywords = ["rclone", "fuse", "gui", "cloud", "google-drive", "onedrive", "pyside6", "qt6"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "PySide6>=6.6,<7",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
ducksdrive = "main:main"

[tool.setuptools]
py-modules = [
    "filemanager_integration",
    "gui_tray",
    "i18n",
    "keyring_manager",
    "log_viewer",
    "main",
    "notifications",
    "rclone_config",
    "rclone_daemon",
    "rclone_settings",
    "rclone_stats",
    "remote_settings_dialog",
    "settings_dialog",
    "status_popup",
    "updater",
    "vfs_inhibitor",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
