<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Sombra da nuvem (plano de fundo para dar profundidade) -->
  <circle cx="18" cy="48" r="8" fill="#2980b9"/>
  <circle cx="28" cy="40" r="12" fill="#2980b9"/>
  <circle cx="44" cy="44" r="10" fill="#2980b9"/>
  <circle cx="54" cy="48" r="8" fill="#2980b9"/>
  <rect x="18" y="44" width="36" height="12" fill="#2980b9"/>

  <!-- Asinhas fofas (desenhadas atrás do corpo) -->
  <ellipse cx="18" cy="38" rx="5" ry="10" fill="#f39c12" transform="rotate(30 18 38)"/>
  <ellipse cx="46" cy="38" rx="5" ry="10" fill="#f39c12" transform="rotate(-30 46 38)"/>

  <!-- Corpo e Cabeça bem gordinhos -->
  <circle cx="32" cy="36" r="15" fill="#f1c40f"/>
  <circle cx="32" cy="24" r="14" fill="#f1c40f"/>

  <!-- Tufo de Cabelo (Ahoge) -->
  <path d="M 32 11 C 32 4 25 4 25 8 C 25 11 30 12 32 12" fill="#f39c12"/>
  <path d="M 32 11 C 32 2 39 3 39 7 C 39 10 34 11 32 12" fill="#f39c12"/>

  <!-- Olhos escuros -->
  <circle cx="26" cy="22" r="2.5" fill="#2c3e50"/>
  <circle cx="38" cy="22" r="2.5" fill="#2c3e50"/>

  <!-- Brilho molhado nos olhos -->
  <circle cx="25" cy="21" r="1" fill="#ffffff"/>
  <circle cx="37" cy="21" r="1" fill="#ffffff"/>

  <!-- Bochechas coradas -->
  <circle cx="21" cy="26" r="3" fill="#e74c3c" opacity="0.3"/>
  <circle cx="43" cy="26" r="3" fill="#e74c3c" opacity="0.3"/>

  <!-- Bico arredondado com reflexo -->
  <rect x="27" y="24" width="10" height="6" rx="3" fill="#e67e22"/>
  <rect x="28" y="25" width="4" height="1.5" rx="0.75" fill="#ffffff" opacity="0.4"/>

  <!-- Nuvem principal (frente, cobrindo a base do pato) -->
  <circle cx="16" cy="50" r="10" fill="#3498db"/>
  <circle cx="28" cy="42" r="14" fill="#3498db"/>
  <circle cx="42" cy="46" r="12" fill="#3498db"/>
  <circle cx="52" cy="52" r="8" fill="#3498db"/>
  <!-- Base totalmente reta da nuvem para assentar perfeitamente na interface -->
  <rect x="16" y="46" width="36" height="14" fill="#3498db"/>
</svg>
