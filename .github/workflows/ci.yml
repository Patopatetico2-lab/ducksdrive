name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies for Qt and FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 libdbus-1-3 fuse libfuse2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Type check with mypy
        run: |
          mypy ducksdrive

      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v

      - name: Verify scripts and packaging
        run: |
          bash -n install.sh uninstall.sh packaging/build_deb.sh packaging/build_appimage.sh
          python -c "import ducksdrive, ducksdrive.resources; p = ducksdrive.resources.get_icon_path(); assert p and p.endswith('icon.svg'), p"
          bash packaging/build_deb.sh
          dpkg-deb -c ducksdrive_*_all.deb | grep -q "/usr/share/ducksdrive/ducksdrive/main.py"
          rm -f ducksdrive_*_all.deb
