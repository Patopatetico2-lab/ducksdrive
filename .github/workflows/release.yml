name: Release Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2 desktop-file-utils curl unzip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "PySide6>=6.6,<7" requests

      - name: Build with PyInstaller
        run: |
          pyinstaller --name ducksdrive --windowed --icon=icon.svg --add-data "icon.svg:." --hidden-import PySide6.QtSvg --noconfirm main.py

      - name: Create AppDir Structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          
          # Copy PyInstaller binary output
          cp -r dist/ducksdrive/* AppDir/usr/bin/

          # Download and bundle rclone
          curl -O https://downloads.rclone.org/v1.73.5/rclone-v1.73.5-linux-amd64.zip
          unzip -j rclone-v1.73.5-linux-amd64.zip rclone-v1.73.5-linux-amd64/rclone -d AppDir/usr/bin/
          rm rclone-v1.73.5-linux-amd64.zip
          chmod +x AppDir/usr/bin/rclone

          # Copy icon
          cp icon.svg AppDir/usr/share/icons/hicolor/scalable/apps/ducksdrive.svg
          cp icon.svg AppDir/ducksdrive.svg

          # Create desktop file
          cat << 'DESKTOP' > AppDir/usr/share/applications/ducksdrive.desktop
          [Desktop Entry]
          Name=DucksDrive
          Comment=Manage cloud drives with Rclone
          Exec=ducksdrive
          Icon=ducksdrive
          Terminal=false
          Type=Application
          Categories=Network;Utility;
          StartupNotify=true
          StartupWMClass=ducksdrive
          DESKTOP
          
          cp AppDir/usr/share/applications/ducksdrive.desktop AppDir/ducksdrive.desktop
          
          # Create AppRun script with LD_LIBRARY_PATH
          cat << 'APPRUN' > AppDir/AppRun
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH:-}"
          exec "${HERE}/usr/bin/ducksdrive" "$@"
          APPRUN
          chmod +x AppDir/AppRun

      - name: Download and Setup appimagetool
        run: |
          curl -L -O https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir DucksDrive-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-package
          path: DucksDrive-x86_64.AppImage

  build-deb:
    name: Build Debian (.deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build .deb Package
        run: |
          bash build_deb.sh

      - name: Upload Debian Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: ducksdrive_*_all.deb

  build-arch:
    name: Build Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git python

      - name: Build Arch Package with makepkg
        run: |
          # makepkg requires a non-root user
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "makepkg --nodeps --noextract --syncdeps --noconfirm"

      - name: Upload Arch Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: ducksdrive-*.pkg.tar.zst

  build-flatpak:
    name: Build Flatpak (.flatpak)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flatpak Builder
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ducksdrive.flatpak
          manifest-path: com.github.patopatetico2.ducksdrive.yml
          run-tests: false

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-package
          path: ducksdrive.flatpak

  publish-release:
    name: Publish Release Artifacts
    needs: [build-appimage, build-deb, build-arch, build-flatpak]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download AppImage Artifact
        uses: actions/download-artifact@v4
        with:
          name: appimage-package
          path: dist-release

      - name: Download Debian Artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: dist-release

      - name: Download Arch Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: dist-release

      - name: Download Flatpak Artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-package
          path: dist-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/*
